name: Build Veil

on:
  push:
    paths:
      - "VeilForge/**"
      - ".github/workflows/build-veilforge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Veil
        working-directory: VeilForge
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: Veil-Forge-1.20.1
          path: VeilForge/build/libs/*.jar
          if-no-files-found: error
