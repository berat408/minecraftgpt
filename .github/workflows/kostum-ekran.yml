name: KostumEkran Derleme
on:
  push:
    branches: [kostum-ekran]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.8 }
      - name: Derle
        working-directory: CustomMenu/forge-1.20.1
        run: |
          if ! gradle build --stacktrace > ../../build.log 2>&1; then
            ERR=$( (grep -nE "error:|What went wrong|Could not|FAILED" -A3 ../../build.log | head -c 3500) || true )
            if [ -z "$ERR" ]; then ERR=$(tail -n 30 ../../build.log | head -c 3500); fi
            ERR="${ERR//'%'/'%25'}"
            ERR="${ERR//$'\n'/'%0A'}"
            ERR="${ERR//$'\r'/'%0D'}"
            echo "::error title=Derleme hatasi::$ERR"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: derleme-kaydi, path: build.log }
      - uses: actions/upload-artifact@v4
        with: { name: custommenu-jar, path: CustomMenu/forge-1.20.1/build/libs/*.jar }
