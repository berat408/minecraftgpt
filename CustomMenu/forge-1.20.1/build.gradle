plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.2.0'
group = 'com.custommenu'

base {
    archivesName = 'custommenu-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                custommenu {
                    source sourceSets.main
                }
            }
        }
    }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    shade 'org.jcodec:jcodec:0.2.5'
    shade 'org.jcodec:jcodec-javase:0.2.5'
    shade 'javazoom:jlayer:1.0.1'
    shade 'com.tianscar.javasound:jaad:0.9.4'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes([
            "Specification-Title": "custommenu",
            "Specification-Vendor": "custommenu",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "custommenu"
        ])
    }
}

jar.finalizedBy('reobfJar')
