plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
group = 'com.custommenu'
version = '1.3.1'
base { archivesName = 'custommenu-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
sourceSets.main.java.srcDir '../common/src/main/java'

configurations { shade }
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // MP3 (jlayer) ve MP4 (jcodec) çözücüler; mod JAR'ının içine gömülür
    ['javazoom:jlayer:1.0.1', 'org.jcodec:jcodec:0.2.5', 'org.jcodec:jcodec-javase:0.2.5'].each { lib ->
        implementation lib
        shade lib
    }
}

// MP3 kütüphanesini mod JAR'ının içine göm
jar {
    from { configurations.shade.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
